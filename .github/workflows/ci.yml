# CI GitHub Actions : tests backend, tests frontends, build Docker.
name: CI

# Déclenche la CI sur chaque push et chaque pull request.
on:
  push:
  pull_request:

# Autorise uniquement la lecture du code (sécurité).
permissions:
  contents: read

jobs:
  # --- Job 1 : tests du backend FastAPI ---
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      # Récupère le code du dépôt.
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Installe Python 3.12 avec cache pip (accélère les runs suivants).
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend_fastapi/requirements*.txt

      # Installe les dépendances de prod ET de dev (pytest, httpx).
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_fastapi/requirements.txt -r backend_fastapi/requirements-dev.txt

      # Lance pytest via python -m (pour que le module 'app' soit trouvé).
      - name: Lancer les tests de l'API
        working-directory: backend_fastapi
        run: python -m pytest -v

  # --- Job 2 : tests des frontends (JS et TS en parallèle) ---
  frontend-tests:
    name: Frontend tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Lance le job une fois par projet (frontend-js, frontend-ts).
        project: [frontend-js, frontend-ts]
    defaults:
      run:
        working-directory: ./${{ matrix.project }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Installe Node.js 20 avec cache npm.
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      # Installe les dépendances de manière stricte (via package-lock.json).
      - name: Installer les dépendances
        run: npm ci

      # Lance npm test (défini dans le package.json du projet).
      - name: Lancer les tests
        run: npm test

  # --- Job 3 : vérification et build des images Docker ---
  docker-build:
    name: Vérifier la configuration et construire les images
    runs-on: ubuntu-latest
    env:
      # Variables nécessaires à docker compose config.
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: todolist
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Vérifie que docker-compose.yml est valide (syntaxe, variables).
      - name: Vérifier la configuration Docker Compose
        run: docker compose config --quiet

      # Construit toutes les images (backend + 2 frontends) sans les démarrer.
      - name: Construire les images Docker
        run: docker compose build # construit les images dockers

      # Vérifie aussi le stage Docker dédié aux tests du backend.
      - name: Exécuter les tests backend dans Docker
        run: docker compose --profile test run --build --rm backend-test