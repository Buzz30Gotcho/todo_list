<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Todo List — JavaScript</title>
  </head>
  <body>
    <div class="app">
      <div class="card">
        <header class="header">
          <h1>Todo<span class="accent">List</span></h1>
          <span class="badge">JavaScript</span>
        </header>
        <p class="subtitle" id="subtitle"></p>
        <div class="progress">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <form class="add-form" id="addForm">
          <input class="input" id="titleInput" placeholder="Nouvelle tâche…" />
          <input
            class="input"
            id="descInput"
            placeholder="Description (optionnel)"
          />
          <button class="btn btn-primary" type="submit">Ajouter</button>
        </form>

        <div class="filters" id="filters">
          <button class="chip active" data-filter="all">
            Toutes <span class="count" id="countAll">0</span>
          </button>
          <button class="chip" data-filter="active">
            En cours <span class="count" id="countActive">0</span>
          </button>
          <button class="chip" data-filter="done">
            Terminées <span class="count" id="countDone">0</span>
          </button>
        </div>

        <div id="content"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
