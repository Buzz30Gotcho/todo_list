services:
  db:
    image: postgres:16-alpine
    container_name: todo_db
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todolist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todolist"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: todo_backend
    environment:
      DATABASE_URL: postgresql://todo:todo@db:5432/todolist
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    restart: unless-stopped

  frontend-js:
    build: ./frontend-js
    container_name: todo_frontend_js
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  frontend-ts:
    build: ./frontend-ts
    container_name: todo_frontend_ts
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  pgdata:
