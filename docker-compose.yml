# docker compose up -d --build
# http://localhost:8083/
# http://localhost:8084/
services:

  db:
    image: postgres:16-alpine
    container_name: todo_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Conserve les données même si les conteneurs sont recréés.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Indique à Compose quand PostgreSQL accepte les connexions.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # API FastAPI connectée à la base de données.
  backend:
    build:
      context: ./backend_fastapi
    container_name: todo_backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    # Rend l'API accessible sur localhost:8001.
    ports:
      - "8001:8000"
    restart: unless-stopped

  # Frontend JavaScript, accessible sur localhost:8083.
  frontend-js:
    build: ./frontend-js
    container_name: todo_frontend_js
    depends_on:
      - backend
    ports:
      - "8083:8080"
    restart: unless-stopped

  # Frontend TypeScript, accessible sur localhost:8084.
  frontend-ts:
    build: ./frontend-ts
    container_name: todo_frontend_ts
    depends_on:
      - backend
    ports:
      - "8084:80"
    restart: unless-stopped

# Volume Docker persistant pour les données PostgreSQL.
volumes:
  pgdata:
